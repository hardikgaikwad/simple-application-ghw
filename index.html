<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PAPER CUT — a local-first PDF page editor for merging, reordering, rotating, and exporting PDFs in the browser."
    />
    <title>PAPER CUT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand-wrap">
          <div class="wordmark" aria-label="PAPER CUT wordmark">PAPER CUT</div>
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" aria-label="Paper and scissors icon">
              <path d="M15 17l15 15-15 15M49 17L34 32l15 15" />
              <circle cx="20" cy="18" r="9" />
              <circle cx="44" cy="46" r="9" />
              <path d="M26 25l15 15" />
            </svg>
          </div>
        </div>
        <div class="privacy-badges" aria-label="Privacy status">
          <span class="privacy-tag">100% LOCAL PROCESSING</span>
          <span class="privacy-tag">YOUR FILES STAY ON THIS DEVICE</span>
        </div>
        <button id="downloadBtn" class="primary-button" type="button" disabled>Download PDF</button>
      </header>

      <main class="workspace-shell">
        <div id="statusBanner" class="status-banner" role="status" aria-live="polite"></div>

        <section id="emptyState" class="empty-state panel">
          <div class="intro-copy">
            <p class="kicker">PDFs, cut your way.</p>
            <p class="supporting-text">Merge, rearrange, rotate, and remove pages. No uploads. No accounts. No nonsense.</p>
          </div>

          <label class="upload-dropzone" for="fileInput" aria-label="Upload PDF files">
            <input id="fileInput" type="file" accept="application/pdf" multiple />
            <span class="dropzone-icon" aria-hidden="true">✦</span>
            <span class="dropzone-label">CHOOSE PDF</span>
            <small>Multiple PDFs are accepted. Files stay in your browser.</small>
          </label>
        </section>

        <section id="editorState" class="editor hidden" aria-live="polite">
          <div class="toolbar">
            <div class="toolbar-group left-actions">
              <button id="addPdfBtn" class="tool-button" type="button">Add PDF</button>
              <button id="undoBtn" class="tool-button" type="button">Undo</button>
              <button id="redoBtn" class="tool-button" type="button">Redo</button>
              <button id="resetBtn" class="tool-button danger" type="button">Reset document</button>
            </div>
            <div class="toolbar-group right-actions">
              <span id="pageCount" class="page-count">0 pages</span>
              <button id="downloadToolbarBtn" class="primary-button toolbar-download" type="button">Download PDF</button>
            </div>
          </div>

          <div id="pageGrid" class="page-grid" aria-label="PDF page grid"></div>

          <div class="add-more-zone">
            <button id="addMorePdfBtn" class="add-more-button" type="button">ADD ANOTHER PDF</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
